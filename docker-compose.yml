services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: tahseel
      POSTGRES_PASSWORD: tahseel
      POSTGRES_DB: tahseel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tahseel -d tahseel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
